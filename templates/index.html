<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Title</title>
  <link rel="stylesheet" href="">
</head>
<body>

<main>
  <div class="title">
    <h1>Welcome to this QR-code generator</h1>
    <h2> Insert a link below to generate a QR-code <h2>
  </div>
  <form action="/" method="POST">
    <div class="input-group">
      <input type="text" name="link" value="{{ link or '' }}" required>
      {% if data %}
        <img class="qr-code" src="{{ data }}" alt="Generated QR code">
      {% endif %}
    </div>
    <button type="submit"> Generate QR-code </button> 
  </form>
  {% if error %}
    <p role="alert">{{ error }}</p>
  {% endif %}
</main>

<script src=""></script>

  </body>
</html>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html, 
    body{
        margin: 0rem 10rem;
        font-family: "Poppins", sans-seriff;
    }
    
    .title{
        padding: 6rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
        justify-content: center;
        align-items: center;
        color: rgb(37,37,37)
    }
    form{
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;
    }
    form input{
        font-size: 1.2rem;
        padding: 0 5rem 2rem;
        width: 100%;
        background: white;
        color: rgb(37, 37, 37);
        border: 2px solid rgb(41, 64, 121);
        border-radius: 0.5rem;
    }
    .input-group{
        display: flex;
        flex-direction: column;
        width: 50%;
        gap: 1rem;
    }
    .qr-code{
        width: 300px;
        max-width: 100%;
        align-self: center;
    }
    form button{
        font-size: 1rem;
        background: rgb(41, 64, 121);
        border: none;
        color: white;
        padding: 1rem 1.5rem;
        cursor: pointer;
        border-radius: 0.5rem;
    }
</style>
